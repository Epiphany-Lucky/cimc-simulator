name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install emulator dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Run firmware and circuit tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows shell
        run: dotnet build desktop/CimcLab.csproj -c Release
      - name: Upload browser application
        uses: actions/upload-artifact@v4
        with:
          name: cimc-studio-html
          path: web/
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies
        shell: pwsh
        run: ./scripts/setup.ps1 -Testing
      - name: Build both distributable applications
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Execute packaged firmware engine
        run: .venv/Scripts/python.exe tests/package_smoke.py artifacts/CIMC-Studio-0.1.0-html-local
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-html-release
          path: artifacts/CIMC-Studio-*.zip
